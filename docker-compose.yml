services:
  kavita:
    image: jvmilazz0/kavita:latest
    container_name: kavita
    volumes:
      - ./kavita_data:/kavita/config:rw
      - /mnt/media/Library/EBooks:/Books/ebooks:rw
      - /mnt/media/Library/GraphicNovels:/Books/graphicnovels:rw
      - /mnt/media/Library/Comics:/Books/comics:rw
      - /mnt/media/Library/Manga:/Books/manga:rw
    restart: unless-stopped
    networks:
      - media-network

  audiobookshelf:
    image: ghcr.io/advplyr/audiobookshelf:latest
    container_name: audiobookshelf
    volumes:
      - ./abs_config:/config:rw
      - ./abs_metadata:/metadata:rw
      - /mnt/media/Library/Audio/Audiobooks:/audiobooks:rw
      - /mnt/media/Library/Audio/Podcasts:/podcasts:rw
    restart: unless-stopped
    networks:
      - media-network

  folio:
    build:
      context: ./folio-reader
      dockerfile: Dockerfile
      args:
        - EXPO_PUBLIC_KAVITA_URL=${EXPO_PUBLIC_KAVITA_URL:-http://localhost:8050}
        - EXPO_PUBLIC_KAVITA_API_KEY=${KAVITA_API_KEY}
        - EXPO_PUBLIC_KAVITA_USERNAME=${KAVITA_JWT_USERNAME}
        - EXPO_PUBLIC_KAVITA_PASSWORD=${KAVITA_JWT_PASSWORD}
        - EXPO_PUBLIC_ABS_URL=${EXPO_PUBLIC_ABS_URL:-http://localhost:81}
        - EXPO_PUBLIC_ABS_API_KEY=${ABS_API_KEY}
        - EXPO_PUBLIC_ABS_USERNAME=${ABS_JWT_USERNAME}
        - EXPO_PUBLIC_ABS_PASSWORD=${ABS_JWT_PASSWORD}
        - EXPO_PUBLIC_GOOGLE_BOOKS_API_KEY=${GOOGLE_BOOKS_API_KEY}
        - EXPO_PUBLIC_PUBLIC_SERVER_URL=${PUBLIC_SERVER_URL}
        - EXPO_PUBLIC_PROFILE_API_KEY=${PROFILE_API_KEY}
    container_name: folio
    restart: unless-stopped
    networks:
      - media-network

  webhook-server:
    build:
      context: ./folio-reader
      dockerfile: Dockerfile.webhook
    container_name: folio-webhook
    ports:
      - "9000:9000"
    environment:
      - DEPLOY_SECRET=${DEPLOY_SECRET}
      - PUBLIC_SERVER_URL=${PUBLIC_SERVER_URL}
      - FOLIO_API_KEY=${FOLIO_API_KEY}
    volumes:
      - .:/repo
      - /var/run/docker.sock:/var/run/docker.sock
      - ./data:/data
    restart: unless-stopped
    networks:
      - media-network

  dockhand:
    image: fnsys/dockhand:latest
    container_name: dockhand
    ports:
      - "8080:3000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: unless-stopped
    networks:
      - media-network

networks:
  media-network:
    external: true
